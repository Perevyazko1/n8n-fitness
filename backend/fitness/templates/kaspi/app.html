<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Траты Kaspi</title>
<!-- kaspi-pay Mini App (вариант C). API: /api/kaspi/summary | budget-set | expense-update. Проект — kaspi-pay/WORKLOG.md -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #eff1f5);
    --text: var(--tg-theme-text-color, #111827);
    --hint: var(--tg-theme-hint-color, #5f6672);
    --accent: var(--tg-theme-button-color, #1f6fd1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, var(--accent));
    --soft: color-mix(in srgb, var(--hint) 12%, var(--bg));
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --bar: color-mix(in srgb, var(--accent) 28%, var(--bg));
    --warn: #b45309;
    --good: #15803d;
    --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
  button, input { font: inherit; color: inherit; }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chip { border: 0; border-radius: 999px; padding: 8px 12px; background: var(--bg); font-size: 13.5px;
    font-weight: 600; white-space: nowrap; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .card { background: var(--bg); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .hint { color: var(--hint); font-size: 13px; }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  .link { border: 0; background: none; padding: 6px 0; color: var(--link); font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .btn { border: 0; height: 50px; border-radius: 14px; background: var(--accent); color: var(--accent-text);
    font-weight: 600; cursor: pointer; width: 100%; }
  .btn:disabled { opacity: .5; }
  .bars { display: grid; gap: 4px; align-items: end; height: 60px; }
  .bars > * { display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; height: 100%; }
  .bars i { display: block; width: 100%; border-radius: 4px; background: var(--bar); min-height: 3px; }
  .bars i.today { background: var(--accent); }
  .bars i.over { background: var(--bad); }
  .bars button { border: 0; background: none; padding: 0; cursor: pointer; position: relative; }
  /* план дня (от остатка на утро этого дня) — планка поверх столбика */
  .bars b.plan { position: absolute; left: -1px; right: -1px; height: 2px; border-radius: 2px; background: var(--text); opacity: .7; pointer-events: none; }
  /* на сколько день вылез за свой план */
  .bars em { font-style: normal; font-size: 10.5px; line-height: 13px; font-weight: 700; color: var(--bad); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bars em.env { color: var(--hint); font-weight: 600; }
  /* будущий день — пустой конверт высотой «можно в день» */
  .bars i.env { background: none; border: 1.5px dashed color-mix(in srgb, var(--hint) 70%, transparent); }
  .bars button:disabled { cursor: default; }
  .bars .picked i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bars .picked span { color: var(--text); font-weight: 700; }
  .daynav { display: flex; align-items: center; gap: 4px; background: var(--bg); border-radius: 14px; padding: 4px; }
  .daynav b { flex: 1; text-align: center; font-size: 15px; }
  .daynav button { border: 0; background: none; min-width: 44px; height: 40px; border-radius: 10px; font-size: 20px;
    color: var(--link); cursor: pointer; }
  .daynav button:disabled { color: var(--sep); cursor: default; }
  .daynav .back { font-size: 13.5px; font-weight: 600; padding: 0 10px; }
  button.day-head { border: 0; background: none; width: 100%; cursor: pointer; text-align: left; }
  .bars span { font-size: 11px; line-height: 14px; color: var(--hint); }
  .progress { height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--bg); border-radius: 12px; padding: 4px; }
  .tabs button { border: 0; background: none; border-radius: 9px; padding: 8px 0; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-text); }
  .cat { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .cat .line { display: flex; justify-content: space-between; font-size: 14px; }
  .cat .track { height: 6px; border-radius: 999px; background: var(--soft); }
  .cat .track i { display: block; height: 6px; border-radius: 999px; }
  .cat.dim { opacity: .45; }
  .cat.out .line { color: var(--hint); }
  .top-row { display: flex; flex-direction: column; gap: 4px; }
  .top-row .line { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .top-row .line span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-row small { color: var(--hint); font-size: 12.5px; }
  .top-row .track { height: 5px; border-radius: 999px; background: var(--soft); }
  .top-row .track i { display: block; height: 5px; border-radius: 999px; }
  .insight { font-size: 13.5px; padding: 10px 12px; border-radius: 12px; background: var(--soft); }
  .day-head { display: flex; justify-content: space-between; padding: 4px 4px 0; color: var(--hint); font-size: 13px; }
  .list { background: var(--bg); border-radius: 16px; overflow: hidden; }
  .item { display: flex; gap: 12px; align-items: center; padding: 11px 14px; width: 100%; border: 0; background: none;
    text-align: left; cursor: pointer; }
  .item + .item { border-top: 1px solid var(--sep); }
  .item .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .item .m { flex: 1; min-width: 0; }
  .item .m .orig { display: block; color: var(--hint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { display: block; color: var(--hint); font-size: 12.5px; }
  .item .r { text-align: right; white-space: nowrap; font-weight: 600; }
  .item.out { opacity: .55; }
  .who { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    color: var(--who); background: color-mix(in srgb, var(--who) 16%, transparent); }
  .chip .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--who); }
  .excl-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--hint); }
  .excl-line b { color: var(--text); }
  .item.refund .r { color: var(--good); }
  .empty, .error { text-align: center; color: var(--hint); padding: 18px 8px; }
  .error { color: #d14343; }
  .fresh { text-align: center; color: var(--hint); font-size: 12.5px; }
  /* шторки */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .scrim.open { display: flex; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 10px 16px 28px;
    display: flex; flex-direction: column; gap: 14px; max-height: 92vh; overflow-y: auto; }
  .grab { align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--sep); }
  .sheet h2 { margin: 0; font-size: 20px; }
  .x { border: 0; background: none; width: 44px; height: 44px; color: var(--hint); cursor: pointer; font-size: 22px; line-height: 1; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--hint); }
  .field input { border: 1px solid var(--sep); border-radius: 12px; padding: 12px; font-size: 15px; background: var(--bg); color: var(--text); width: 100%; }
  .field input.money { font-size: 26px; font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wrap { display: flex; gap: 6px; flex-wrap: wrap; }
  .soft-chip { border: 0; border-radius: 999px; padding: 8px 12px; background: var(--soft); font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .soft-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--soft);
    border-radius: 14px; padding: 12px 14px; }
  .toggle.plain { background: none; padding: 0 4px; }
  .toggle input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
  .toggle span small { display: block; color: var(--hint); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="chips" id="cards" role="group" aria-label="Карта"></div>

  <section class="card" id="budget"></section>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-p="day">Сегодня</button>
    <button role="tab" data-p="yesterday">Вчера</button>
    <button role="tab" data-p="week">Неделя</button>
    <button role="tab" data-p="month">Месяц</button>
    <button role="tab" data-p="custom">Период</button>
  </div>

  <div class="daynav" id="daynav" hidden></div>
  <section class="card" id="cats"></section>
  <section class="card" id="top"></section>
  <div id="list"></div>
  <div class="fresh" id="fresh"></div>
</main>

<!-- шторка: лимит -->
<div class="scrim" id="limitSheet">
  <form class="sheet" id="limitForm" novalidate>
    <div class="grab"></div>
    <div class="row-between"><h2>Лимит на период</h2><button type="button" class="x" data-close aria-label="Закрыть">×</button></div>
    <div class="wrap" id="presets">
      <button type="button" class="soft-chip" data-preset="fri">Пт — Чт</button>
      <button type="button" class="soft-chip" data-preset="mon">Пн — Вс</button>
      <button type="button" class="soft-chip" data-preset="month">Месяц</button>
    </div>
    <div class="grid2">
      <label class="field">С<input type="date" name="start" required></label>
      <label class="field">По (включительно)<input type="date" name="end" required></label>
    </div>
    <label class="field">Можно потратить, ₽<input class="money" type="number" name="limit" min="1" step="1" inputmode="numeric" required></label>
    <div class="hint" id="limitHint"></div>
    <div class="hint">Лимит общий: считаются траты всех карт, кроме отмеченных «вне лимита».</div>
    <button class="btn" type="submit">Сохранить лимит</button>
  </form>
</div>

<!-- шторка: свой период для списка -->
<div class="scrim" id="periodSheet">
  <form class="sheet" id="periodForm">
    <div class="grab"></div>
    <div class="row-between"><h2>Свой период</h2><button type="button" class="x" data-close aria-label="Закрыть">×</button></div>
    <div class="grid2">
      <label class="field">С<input type="date" name="from" required></label>
      <label class="field">По<input type="date" name="to" required></label>
    </div>
    <button class="btn" type="submit">Показать</button>
  </form>
</div>

<!-- шторка: трата -->
<div class="scrim" id="expSheet">
  <form class="sheet" id="expForm">
    <div class="grab"></div>
    <div class="row-between">
      <div><h2 id="expTitle"></h2><div class="hint" id="expMeta"></div></div>
      <button type="button" class="x" data-close aria-label="Закрыть">×</button>
    </div>
    <div><div class="big" id="expRub" style="font-size:28px"></div><div class="hint" id="expSub"></div></div>
    <div class="field">Категория<div class="wrap" id="expCats"></div></div>
    <label class="toggle"><span>Не учитывать в лимите<small>Трата останется в списке, но не съест лимит</small></span>
      <input type="checkbox" id="expOut"></label>
    <label class="toggle plain"><span id="expAllLabel"></span><input type="checkbox" id="expAll"></label>
    <button class="btn" type="submit">Готово</button>
  </form>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = (id) => document.getElementById(id);
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const n = (v) => nf.format(Math.round(Math.abs(Number(v) || 0)));
const CUR = { VND: '₫', USD: '$', EUR: '€', RUB: '₽' };
const COLORS = { shops: '#1f6fd1', cafe: '#d9480f', transport: '#0f766e', fun: '#7c3aed', housing: '#6b7280',
  subs: '#0e7490', health: '#be185d', other: '#a16207' };
const PEOPLE = ['#2563eb', '#db2777', '#0f766e', '#d97706'];   // запасные цвета карт по порядку
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const pd = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, k) => { const x = new Date(d); x.setDate(x.getDate() + k); return x; };
const short = (s) => { const d = pd(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const wdShort = (s) => { const d = pd(s); return `${WD[d.getDay()]} ${d.getDate()}`; };
const dayTitle = (s, today) => {
  const d = pd(s), label = `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;
  if (s === today) return 'сегодня, ' + label;
  if (s === iso(addDays(pd(today), -1))) return 'вчера, ' + label;
  return label;
};
const plural = (k, a, b, c) => (k % 10 === 1 && k % 100 !== 11) ? a : ([2,3,4].includes(k % 10) && ![12,13,14].includes(k % 100)) ? b : c;
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}

const state = { period: 'day', from: null, to: null, card: null, category: null, only_excluded: false };
let beforeDrill = null;   // куда вернуться из просмотра (один день / траты вне лимита)

const isDayView = () => state.period === 'custom' && state.from && state.from === state.to;
const inDrill = () => isDayView() || state.only_excluded;
function enterDrill(patch) {
  if (!inDrill()) beforeDrill = { period: state.period, from: state.from, to: state.to, card: state.card,
    category: state.category, only_excluded: false };
  Object.assign(state, patch);
  reload().then(() => $('daynav').scrollIntoView({ behavior: 'smooth', block: 'start' }));
}
// «Провалиться» в день: из столбика лимита или заголовка дня в списке (фильтр «вне лимита» сохраняется)
const openDay = (date) => enterDrill({ period: 'custom', from: date, to: date });
// Траты вне лимита за период: из виджета лимита или строки «Вне лимита» в категориях
const openExcluded = (from, to) => enterDrill({ period: 'custom', from, to, card: null, category: null, only_excluded: true });
function leaveDrill() {
  Object.assign(state, beforeDrill || { period: 'day', from: null, to: null, only_excluded: false });
  beforeDrill = null; reload();
}
let who = {};             // card → { name, color } — чья трата
let data = null;

async function api(path, body) {
  const initData = tg ? tg.initData : '';
  if (!initData) throw new Error('Открой страницу из Kaspi-бота в Telegram.');
  const r = await fetch('/api/kaspi/' + path, { method: 'POST', body: JSON.stringify({ initData, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 || r.status === 403) throw new Error('Нет доступа.');
  if (!r.ok || !j.ok) throw new Error('Ошибка: ' + (j.error || r.status));
  return j;
}

async function reload() {
  try {
    const body = { period: state.period, card: state.card, category: state.category, only_excluded: state.only_excluded };
    if (state.period === 'custom') Object.assign(body, { from: state.from, to: state.to });
    data = await api('summary', body);
    render();
  } catch (e) {
    $('list').replaceChildren(el('div', { class: 'error' }, e.message));
  }
}

function render() {
  const s = data, b = s.budget;
  // карты
  who = Object.fromEntries(s.cards.map((c, i) => [c.card, { name: c.name, color: c.color || PEOPLE[i % PEOPLE.length] }]));
  const cards = [{ card: null, label: s.cards.length > 1 ? 'Обе карты' : 'Все карты' }, ...s.cards];
  $('cards').replaceChildren(...cards.map((c) => el('button', {
    class: 'chip', 'aria-pressed': String(state.card === c.card), style: c.card && who[c.card] ? `--who:${who[c.card].color}` : null,
    onclick: () => { state.card = c.card; reload(); } }, c.card && s.cards.length > 1 ? el('i', { class: 'cdot' }) : null, c.label)));
  renderBudget(b);
  // вкладки
  document.querySelectorAll('#tabs button').forEach((x) => x.setAttribute('aria-selected', String(!inDrill() && x.dataset.p === state.period)));
  renderDayNav(s);
  renderCats(s);
  renderTop(s);
  renderList(s);
  const up = s.last_upload ? new Date(s.last_upload) : null;
  $('fresh').textContent = up
    ? `Данные по выписке на ${short(s.last_op_date)} · загружена ${up.toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}`
    : 'Выписок ещё не было — пришли PDF боту.';
}

// «Всего с вне лимита N ₽ · вне лимита M ₽ ›» — за период лимита, тап → список этих трат
function exclLine(a, today) {
  if (!a.excluded_rub) return null;
  const to = a.end < today ? a.end : today;
  return el('div', { class: 'excl-line' },
    el('span', {}, 'Всего с вне лимита ', el('b', {}, `${n(a.spent_rub + a.excluded_rub)} ₽`)),
    el('button', { class: 'link', style: 'padding:0', onclick: () => openExcluded(a.start, to) }, `вне лимита ${n(a.excluded_rub)} ₽ ›`));
}

function renderBudget(b) {
  const box = $('budget'), a = b.active, today = b.today;
  const todayLine = el('div', { style: 'text-align:right' }, el('div', { class: 'hint' }, 'сегодня'),
    el('div', { style: 'font-size:20px;font-weight:700' }, (b.today_spent_rub < 0 ? '+' : '') + n(b.today_spent_rub) + ' ₽'));
  if (!a) {
    box.replaceChildren(
      el('div', { class: 'row-between' },
        el('div', {}, el('div', { class: 'hint' }, 'Лимит на период'), el('div', { class: 'big', style: 'font-size:24px' }, 'не задан')),
        todayLine),
      el('button', { class: 'btn', onclick: () => openLimit() }, 'Задать лимит'));
    return;
  }
  const range = `${wdShort(a.start)} — ${wdShort(a.end)} ${MON[pd(a.end).getMonth()]}`;
  if (a.upcoming) {
    box.replaceChildren(
      el('div', { class: 'row-between' }, el('span', { class: 'hint' }, `Лимит · ${range}`),
        el('button', { class: 'link', onclick: () => openLimit({ start: a.start, end: a.end, limit_rub: a.limit_rub }) }, 'Изменить')),
      el('div', { class: 'row-between', style: 'align-items:flex-end' },
        el('div', {}, el('div', { class: 'big', style: 'font-size:26px' }, `${n(a.limit_rub)} ₽`),
          el('div', { class: 'hint' }, `начнётся ${short(a.start)} · ~${n(a.limit_rub / a.days.length)} ₽ в день`)),
        todayLine),
      el('button', { class: 'btn', onclick: () => openLimit(b.next_default) },
        `Лимит на текущий период: ${short(b.next_default.start)} — ${short(b.next_default.end)}`));
    return;
  }
  if (a.ended) {
    const over = a.left_rub < 0;
    const nd = b.next_default;
    box.replaceChildren(
      el('div', { class: 'hint' }, `Период ${range} закончился`),
      el('div', {}, el('div', { class: 'big', style: `font-size:28px;color:${over ? 'var(--warn)' : 'var(--good)'}` },
        over ? `Перерасход ${n(a.left_rub)} ₽` : `Уложились, осталось ${n(a.left_rub)} ₽`),
        el('div', { class: 'hint' }, `Потрачено ${n(a.spent_rub)} из ${n(a.limit_rub)} ₽`)),
      exclLine(a, today),
      el('div', { class: 'row-between' }, el('span', { class: 'hint' }, 'Сегодня потрачено'),
        el('b', {}, (b.today_spent_rub < 0 ? '+' : '') + n(b.today_spent_rub) + ' ₽')),
      el('button', { class: 'btn', onclick: () => openLimit(nd) }, `Выставить новый: ${short(nd.start)} — ${short(nd.end)}`));
    return;
  }
  // План дня — от остатка на утро этого дня: перерасход сегодня уменьшает план всех следующих дней.
  // Красный день — вылез за СВОЙ план (над ним «+N»); будущие дни — конверты «можно в день».
  const N = a.days.length, L = a.limit_rub;
  let before = 0;
  const days = a.days.map((d, i) => {
    const past = d.date <= today;
    const plan = Math.max(0, (L - before) / (N - i));
    if (past) before += d.rub;
    return { ...d, past, plan, over: past && d.rub > plan + 0.5 };
  });
  const tday = days.find((d) => d.date === today) || { rub: b.today_spent_rub, plan: 0 };
  const left = L - a.spent_rub, futureDays = days.filter((d) => !d.past).length;
  const futurePlan = futureDays ? Math.max(0, left / futureDays) : 0;
  const canToday = tday.plan - tday.rub;
  const exhausted = left <= 0;
  const k = (v) => N > 10 && Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(1).replace('.', ',').replace(',0', '') + 'к' : n(v);
  const H = 56, LBL = 18;                                   // высота столбиков; место под подпись дня
  const max = Math.max(1, futurePlan, ...days.map((d) => Math.max(d.rub, d.past ? d.plan : 0)));
  const px = (v) => Math.max(3, Math.round(Math.max(0, v) / max * H));
  const bars = el('div', { class: 'bars', style: `grid-template-columns:repeat(${N},1fr);height:${H + LBL + 16}px` },
    ...days.map((d) => el('button', {
      class: isDayView() && state.from === d.date ? 'picked' : '', disabled: !d.past,
      'aria-label': d.past ? `${dayTitle(d.date, today)}: ${n(d.rub)} ₽, план ${n(d.plan)} ₽` + (d.over ? `, перерасход ${n(d.rub - d.plan)} ₽` : '')
        : `${dayTitle(d.date, today)}: можно ${n(futurePlan)} ₽`,
      onclick: () => openDay(d.date) },
      d.past ? (d.over ? el('em', {}, '+' + k(d.rub - d.plan)) : null) : (N <= 10 ? el('em', { class: 'env' }, k(futurePlan)) : null),
      d.past ? el('i', { class: [d.date === today ? 'today' : '', d.over ? 'over' : ''].join(' ').trim() || null, style: `height:${px(d.rub)}px` })
        : el('i', { class: 'env', style: `height:${futurePlan ? px(futurePlan) : 3}px` }),
      d.past ? el('b', { class: 'plan', style: `bottom:${LBL + px(d.plan) - 1}px` }) : null,
      el('span', {}, N <= 10 ? WD[pd(d.date).getDay()] : pd(d.date).getDate()))));
  const pct = Math.min(100, Math.max(0, a.spent_rub / L * 100));
  box.replaceChildren(
    el('div', { class: 'row-between' }, el('span', { class: 'hint' }, `Лимит · ${range}`),
      el('button', { class: 'link', onclick: () => openLimit({ start: a.start, end: a.end, limit_rub: L }) }, 'Изменить')),
    el('div', { class: 'row-between', style: 'align-items:flex-end' },
      el('div', {},
        el('div', { class: 'big', style: exhausted || canToday < 0 ? 'color:var(--bad)' : '' },
          exhausted ? '0 ₽' : `${canToday < 0 ? '−' : ''}${n(canToday)} ₽`),
        el('div', { class: 'hint' }, exhausted ? 'сегодня можно · лимит исчерпан'
          : canToday < 0 ? `сегодня сверх плана · план дня ${n(tday.plan)} ₽`
          : `сегодня можно · план дня ${n(tday.plan)} ₽` + (tday.rub ? `, уже ${n(tday.rub)} ₽` : ''))),
      el('div', { style: 'text-align:right' }, el('div', { class: 'hint' }, 'в день дальше'),
        el('div', { style: 'font-size:20px;font-weight:700' }, futureDays ? `${n(futurePlan)} ₽` : '—'))),
    el('div', { class: 'row-between' },
      el('span', { class: 'hint' }, exhausted ? `перерасход за период · лимит ${n(L)} ₽` : `осталось на период из ${n(L)} ₽`),
      el('b', { style: exhausted ? 'color:var(--bad)' : '' }, `${exhausted && left < 0 ? '−' : ''}${n(left)} ₽`)),
    el('div', { class: 'progress' }, el('i', { style: `width:${pct}%;${exhausted ? 'background:var(--bad)' : ''}` })),
    exclLine(a, today),
    bars,
    futureDays && N > 1 ? el('div', { class: 'hint' }, `было в начале ${n(L / N)} ₽ в день · планка — план дня, рамка — сколько можно дальше`) : null);
}

function renderDayNav(s) {
  const nav = $('daynav');
  nav.hidden = !inDrill();
  if (nav.hidden) return;
  const d = state.from, today = s.budget.today;
  if (!isDayView()) {                    // траты вне лимита за период
    nav.replaceChildren(el('b', {}, `Вне лимита · ${short(s.from)} — ${short(s.to)}`),
      el('button', { class: 'back', onclick: leaveDrill }, 'Назад'));
    return;
  }
  const prev = iso(addDays(pd(d), -1)), next = iso(addDays(pd(d), 1));
  nav.replaceChildren(
    el('button', { 'aria-label': 'Предыдущий день', onclick: () => openDay(prev) }, '‹'),
    el('b', {}, dayTitle(d, today) + (state.only_excluded ? ' · вне лимита' : '')),
    el('button', { 'aria-label': 'Следующий день', disabled: next > today, onclick: () => openDay(next) }, '›'),
    el('button', { class: 'back', onclick: leaveDrill }, 'Назад'));
}

function renderCats(s) {
  const box = $('cats');
  const cats = s.categories;
  if (!cats.length || state.only_excluded) { box.style.display = 'none'; return; }
  box.style.display = '';
  const max = Math.max(1, ...cats.map((c) => c.rub));
  const rows = [];
  for (const c of cats) {
    const dim = state.category && state.category !== c.key;
    if (c.rub > 0 || c.rub < 0) rows.push(el('button', { class: 'cat' + (dim ? ' dim' : ''), onclick: () => toggleCat(c.key) },
      el('span', { class: 'line' }, el('span', {}, c.label), el('b', {}, n(c.rub) + ' ₽')),
      el('span', { class: 'track' }, el('i', { style: `width:${Math.max(2, c.rub / max * 100)}%;background:${COLORS[c.key]}` }))));
  }
  const out = cats.filter((c) => c.excluded_rub);
  if (out.length) rows.push(el('button', { class: 'cat out', onclick: () => openExcluded(s.from, s.to) }, el('span', { class: 'line' },
    el('span', {}, 'Вне лимита: ' + out.map((c) => c.label.toLowerCase()).join(', ')),
    el('b', {}, n(out.reduce((t, c) => t + c.excluded_rub, 0)) + ' ₽ ›'))));
  box.replaceChildren(
    el('div', { class: 'row-between' }, el('b', {}, 'По категориям'),
      state.category ? el('button', { class: 'link', onclick: () => toggleCat(state.category) }, 'Сбросить') : el('span', { class: 'hint' }, 'тап = фильтр')),
    ...rows);
}

// Где больше всего: сети/продавцы по сумме, визиты и медианный чек + выводы «частота или цена»
let topAll = false;
function renderTop(s) {
  const box = $('top'), ms = (s.merchants || []).filter((m) => m.rub > 0);
  if (!ms.length || state.only_excluded) { box.style.display = 'none'; return; }
  box.style.display = '';
  const shown = topAll ? ms : ms.slice(0, 5), max = Math.max(1, ...ms.map((m) => m.rub));
  const times = (k) => plural(k, 'раз', 'раза', 'раз');
  box.replaceChildren(
    el('div', { class: 'row-between' }, el('b', {}, 'Где больше всего'),
      el('span', { class: 'hint' }, state.category ? s.category_labels[state.category] : 'за период')),
    ...(s.insights || []).map((x) => el('div', { class: 'insight' }, x.text)),
    ...shown.map((m) => el('div', { class: 'top-row' },
      el('span', { class: 'line' }, el('span', {}, m.name), el('b', {}, n(m.rub) + ' ₽')),
      el('span', { class: 'track' }, el('i', { style: `width:${Math.max(2, m.rub / max * 100)}%;background:${COLORS[m.category]}` })),
      el('small', {}, [s.category_labels[m.category].toLowerCase(),
        m.visits ? `${m.visits} ${times(m.visits)}` : null,
        m.visits > 1 && m.check ? `чек ~${n(m.check)} ₽` : null,
        m.share != null && m.share < 1 ? `${Math.round(m.share * 100)}% категории` : null,
        m.excluded ? 'вне лимита' : null].filter(Boolean).join(' · ')))),
    ms.length > 5 ? el('button', { class: 'link', onclick: () => { topAll = !topAll; renderTop(s); } },
      topAll ? 'Свернуть' : `Все ${ms.length}`) : null);
}

function toggleCat(key) { state.category = state.category === key ? null : key; reload(); }

function renderList(s) {
  const box = $('list');
  const today = s.budget.today;
  if (!s.items.length) {
    box.replaceChildren(el('div', { class: 'empty' }, state.only_excluded ? 'Трат вне лимита за этот период нет.' : state.period === 'day'
      ? 'За сегодня трат пока нет. Траты появляются, когда присылаешь выписку боту.'
      : 'Трат за этот период нет.'));
    return;
  }
  const dayTot = Object.fromEntries(s.days.map((d) => [d.date, d]));
  const byDay = {};
  for (const it of s.items) (byDay[it.date] = byDay[it.date] || []).push(it);
  const head = el('div', { class: 'row-between', style: 'padding:0 4px' },
    el('span', { class: 'hint' }, s.from === s.to ? short(s.from) : `${short(s.from)} — ${short(s.to)}`),
    el('b', {}, `${n(s.total_rub)} ₽ · ${s.count} ${plural(s.count, 'трата', 'траты', 'трат')}`));
  const multi = s.cards.length > 1;
  const groups = Object.keys(byDay).map((date) => {
    const t = dayTot[date] || { rub: 0, excluded_rub: 0 };
    return [
      el(isDayView() ? 'div' : 'button', { class: 'day-head', onclick: isDayView() ? null : () => openDay(date) },
        el('span', {}, dayTitle(date, today) + (isDayView() ? '' : ' ›')),
        el('span', {}, `${n(t.rub)} ₽` + (t.excluded_rub ? ` · вне лимита ${n(t.excluded_rub)} ₽` : ''))),
      el('div', { class: 'list' }, ...byDay[date].map((it) => {
        const sub = [];
        if (it.orig != null && it.cur) sub.push(`${n(it.orig)} ${CUR[it.cur] || it.cur}`);
        if (it.rub != null) sub.push(`${n(it.kzt)} ₸`);
        const w = multi && it.card ? who[it.card] : null;
        const catLabel = s.category_labels[it.category] + (it.excluded ? ' · вне лимита' : '') + (it.refund ? ' · возврат' : '');
        return el('button', { class: 'item' + (it.excluded ? ' out' : '') + (it.refund ? ' refund' : ''), onclick: () => openExpense(it),
            style: w ? `box-shadow:inset 3px 0 0 ${w.color}` : null },
          el('span', { class: 'dot', style: `background:${COLORS[it.category]}` }),
          el('span', { class: 'm' }, el('b', {}, it.name_ru || it.merchant),
            it.name_ru ? el('span', { class: 'orig' }, it.merchant) : null, el('small', {}, catLabel)),
          el('span', { class: 'r' }, it.rub != null ? `${it.refund ? '+' : ''}${n(it.rub)} ₽` : `${n(it.kzt)} ₸`,
            sub.length || w ? el('small', {}, sub.join(' · '), w ? [sub.length ? ' ' : '', el('span', { class: 'who', style: `--who:${w.color}` }, w.name)] : null) : null));
      })),
    ];
  });
  box.replaceChildren(el('div', { style: 'display:flex;flex-direction:column;gap:8px' }, head, ...groups.flat()));
}

// ---- шторки ----
const open = (id) => $(id).classList.add('open');
const close = (id) => $(id).classList.remove('open');
document.querySelectorAll('.scrim').forEach((sc) => {
  sc.addEventListener('click', (e) => { if (e.target === sc || e.target.hasAttribute('data-close')) sc.classList.remove('open'); });
});

function openLimit(pref) {
  const f = $('limitForm'), nd = (data && data.budget.next_default) || {};
  const p = pref || nd;
  f.start.value = p.start || ''; f.end.value = p.end || '';
  f.limit.value = p.limit_rub ? Math.round(p.limit_rub) : (nd.limit_rub ? Math.round(nd.limit_rub) : '');
  markPreset(); limitHint(); open('limitSheet');
}
function limitHint() {
  const f = $('limitForm');
  if (!f.start.value || !f.end.value || f.end.value < f.start.value) { $('limitHint').textContent = ''; return; }
  const days = Math.round((pd(f.end.value) - pd(f.start.value)) / 864e5) + 1;
  const lim = Number(f.limit.value) || 0;
  $('limitHint').textContent = `${days} ${plural(days, 'день', 'дня', 'дней')}` + (lim ? ` · ≈ ${n(lim / days)} ₽ в день` : '');
}
function presetRange(kind) {
  const t = pd(data.budget.today);
  if (kind === 'fri') { const nd = data.budget.next_default; return [nd.start, nd.end]; }
  if (kind === 'mon') { const s = addDays(t, -((t.getDay() + 6) % 7)); return [iso(s), iso(addDays(s, 6))]; }
  const s = new Date(t.getFullYear(), t.getMonth(), 1), e = new Date(t.getFullYear(), t.getMonth() + 1, 0);
  return [iso(s), iso(e)];
}
function markPreset() {
  const f = $('limitForm');
  document.querySelectorAll('#presets [data-preset]').forEach((b) => {
    const [s, e] = presetRange(b.dataset.preset);
    b.setAttribute('aria-pressed', String(f.start.value === s && f.end.value === e));
  });
}
document.querySelectorAll('#presets [data-preset]').forEach((b) => b.addEventListener('click', () => {
  const f = $('limitForm'); [f.start.value, f.end.value] = presetRange(b.dataset.preset); markPreset(); limitHint();
}));
['start', 'end', 'limit'].forEach((k) => $('limitForm')[k].addEventListener('input', () => { markPreset(); limitHint(); }));
$('limitForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('.btn'), hint = $('limitHint');
  // встроенная проверка формы в webview Telegram молчит — проверяем сами и пишем, что не так
  const lim = Number(String(f.limit.value).replace(/\s/g, ''));
  if (!f.start.value || !f.end.value) { hint.textContent = 'Укажи даты начала и конца.'; return; }
  if (f.end.value < f.start.value) { hint.textContent = 'Конец периода раньше начала.'; return; }
  if (!(lim > 0)) { hint.textContent = 'Укажи сумму лимита больше нуля.'; return; }
  btn.disabled = true; btn.textContent = 'Сохраняю…';
  try {
    await api('budget-set', { start: f.start.value, end: f.end.value, limit_rub: lim });
    close('limitSheet'); tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
    await reload();
  } catch (err) { hint.textContent = err.message; }
  btn.disabled = false; btn.textContent = 'Сохранить лимит';
});

$('periodForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.to.value < f.from.value) return;
  Object.assign(state, { period: 'custom', from: f.from.value, to: f.to.value, only_excluded: false });
  beforeDrill = null; close('periodSheet'); reload();
});
document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
  if (b.dataset.p === 'custom') {
    const f = $('periodForm'), t = data ? data.budget.today : iso(new Date());
    f.from.value = state.from || iso(addDays(pd(t), -6)); f.to.value = state.to || t;
    open('periodSheet'); return;
  }
  beforeDrill = null; Object.assign(state, { period: b.dataset.p, only_excluded: false }); reload();
}));

let editing = null;
function openExpense(it) {
  editing = { it, category: it.category };
  $('expTitle').textContent = it.name_ru || it.merchant;
  const cardLabel = (data.cards.find((c) => c.card === it.card) || {}).label, w = who[it.card];
  $('expMeta').replaceChildren(it.name_ru ? el('div', {}, it.merchant) : '', dayTitle(it.date, data.budget.today),
    cardLabel ? ' · ' : '', w && data.cards.length > 1 ? el('span', { class: 'who', style: `--who:${w.color}` }, cardLabel) : (cardLabel || ''));
  $('expRub').textContent = it.rub != null ? `${it.refund ? '+' : ''}${n(it.rub)} ₽` : `${n(it.kzt)} ₸`;
  $('expSub').textContent = [it.orig != null && it.cur ? `${n(it.orig)} ${CUR[it.cur] || it.cur}` : null, `${n(it.kzt)} ₸`].filter(Boolean).join(' · ');
  $('expOut').checked = it.excluded;
  $('expAll').checked = false;
  const group = it.merchant.includes('*') ? it.merchant.split('*')[0].trim() + '*…' : it.merchant;
  $('expAllLabel').replaceChildren(`Так же для всех трат ${group}`,
    el('small', {}, `Прошлые и будущие · сейчас ${it.merchant_count} ${plural(it.merchant_count, 'трата', 'траты', 'трат')}`));
  drawExpCats(); open('expSheet');
}
function drawExpCats() {
  $('expCats').replaceChildren(...Object.entries(data.category_labels).map(([k, v]) => el('button', {
    type: 'button', class: 'soft-chip', 'aria-pressed': String(editing.category === k),
    onclick: () => { editing.category = k; drawExpCats(); } }, v)));
}
$('expForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  // отправляем только то, что поменяли: с галкой непоменянная категория не должна застыть
  // в правиле продавца (иначе «Прочее» навсегда перекроет автоматику)
  const it = editing.it, body = { id: it.id, apply_to_merchant: $('expAll').checked };
  if (editing.category !== it.category) body.category = editing.category;
  if ($('expOut').checked !== it.excluded) body.excluded = $('expOut').checked;
  if (body.apply_to_merchant && !('category' in body) && !('excluded' in body)) body.excluded = it.excluded;
  if (!('category' in body) && !('excluded' in body)) { close('expSheet'); return; }
  const btn = e.target.querySelector('.btn'); btn.disabled = true;
  try { await api('expense-update', body); close('expSheet'); await reload(); }
  catch (err) { $('expSub').textContent = err.message; }
  btn.disabled = false;
});

reload();
</script>
</body>
</html>

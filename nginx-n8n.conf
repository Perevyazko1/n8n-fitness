# vhost для n8n-fitness.ru
#
# Куда положить:
#   на сервере nginx-контейнер монтирует один файл —
#   /root/nginx/nginx.conf. Поэтому ЭТИ server-блоки нужно
#   ВСТАВИТЬ ВНУТРЬ блока http { ... } существующего nginx.conf, рядом с
#   уже работающими server-блоками для dev-rs-auto.store.
#
# После правки nginx.conf:
#   docker exec nginx nginx -t          # проверка синтаксиса
#   docker exec nginx nginx -s reload   # горячий релоад
#
# Сертификат выпускается отдельно через certbot --standalone
# (см. README.md шаг "TLS"). На время выпуска nginx-контейнер
# останавливается, /var/www/certbot НЕ используется.
#
# Доступ (2026-10-26, после пометки Google Safe Browsing «обманные страницы»):
#   публично открыты только машинные эндпоинты — /webhook*/ (Telegram, Mini App),
#   /api/ (Django для Mini App), /django-static/, /healthz.
#   UI n8n и Django /admin — за basic auth (или без пароля с VPN amnezia-wg,
#   клиенты которого приходят в nginx как 172.17.0.3). Краулер видит 401,
#   а не форму логина n8n на чужом домене, которую принимает за фишинг.
#
#   Файл паролей лежит в /etc/letsencrypt — это единственный каталог хоста,
#   который уже смонтирован в nginx-контейнер (сам контейнер чужой, его
#   compose не трогаем). Создать один раз на хосте:
#     printf 'andrey:%s\n' "$(openssl passwd -apr1)" > /etc/letsencrypt/n8n-fitness.htpasswd
#     chmod 644 /etc/letsencrypt/n8n-fitness.htpasswd

# --- HTTP: редирект на HTTPS ---
server {
    listen 80;
    server_name n8n-fitness.ru www.n8n-fitness.ru;

    return 301 https://n8n-fitness.ru$request_uri;
}

# --- HTTPS: реверс-прокси на n8n ---
server {
    listen 443 ssl;
    http2 on;
    server_name n8n-fitness.ru;

    ssl_certificate     /etc/letsencrypt/live/n8n-fitness.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n-fitness.ru/privkey.pem;

    # n8n умеет загружать большие воркфлоу/файлы
    client_max_body_size 50m;

    # По умолчанию всё закрыто: VPN без пароля, остальные — basic auth.
    # Публичные location'ы ниже снимают это через auth_basic off.
    satisfy any;
    allow 172.17.0.3;
    deny  all;
    auth_basic           "n8n-fitness";
    auth_basic_user_file /etc/letsencrypt/n8n-fitness.htpasswd;

    # Индексировать тут нечего
    location = /robots.txt {
        auth_basic off;
        allow all;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # --- Вебхуки n8n: Telegram Trigger, Mini App, Wait-ноды ---
    # Regex-location побеждает "location /", но не ^~ и не точные совпадения.
    location ~ ^/(webhook|webhook-test|webhook-waiting)/ {
        auth_basic off;
        allow all;

        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    location = /healthz {
        auth_basic off;
        allow all;
        proxy_pass http://127.0.0.1:5678;
    }

    # --- Django Mini App API (контейнер fitness-api на 127.0.0.1:8001) ---
    # Важно: этот блок ВЫШЕ "location /", иначе всё уйдёт в n8n.
    location /api/ {
        auth_basic off;
        allow all;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Django-админка (тот же контейнер fitness-api) ---
    # Выше "location /", иначе /admin уйдёт в n8n. Закрыта как и UI n8n.
    location /admin {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Статика админки (WhiteNoise отдаёт под /django-static/) ---
    location /django-static/ {
        auth_basic off;
        allow all;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- UI n8n (+ /rest, /assets) — закрыт серверным satisfy/auth_basic ---
    location / {
        proxy_pass http://127.0.0.1:5678;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE для живых логов и обновлений редактора n8n
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }
}

# --- редирект www -> apex ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.n8n-fitness.ru;

    ssl_certificate     /etc/letsencrypt/live/n8n-fitness.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n-fitness.ru/privkey.pem;

    return 301 https://n8n-fitness.ru$request_uri;
}

                    - generic [ref=f9e2642]:
                      - generic [ref=f9e2643]: Дананг оставил у нашей семьи самые тёплые и яркие впечатления! Ласковое море, просторные пляжи, потрясающая природа и интересные экскурсии — каждый день был наполнен новыми эмоциями и открытиями. Мы прекрасно провели время вместе, много гуляли, любовались красивыми пейзажами и наслаждались атмосферой города. Это путешествие подарило нам множество счастливых моментов, море ярких эмоций и воспоминаний, к которым хочется возвращаться снова и снова! Особенно впечатлили комплекс Бана-Хиллс и знаменитый Золотой мост, который словно поддерживают огромные руки. Незабываемой стала поездка в Небесные ворота Донгзянг со стеклянным мостом Нефритового дракона и великолепными водопадами. Сказочный Хойан очаровал яркими фонариками и семейной прогулкой на лодке. По городу очень удобно передвигались на такси Grab или Xanh SM (Green SM). Обязательно советуем посетить Хойан и Бана-Хиллс! Дананг стал для нас особенным местом — обязательно приедем ещё!
